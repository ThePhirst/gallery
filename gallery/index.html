<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #viewer img {
            max-width: 90%;
            max-height: 80%;
        }

        button {
            margin: 15px 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>FUTURE</h1>

<div class="gallery">
    <img src="images/teaser_1.png" onclick="openImage(0)">
    <img src="images/image2.jpg" onclick="openImage(1)">
    <img src="images/image3.jpg" onclick="openImage(2)">
    <img src="images/image4.jpg" onclick="openImage(3)">
</div>

<div id="viewer">
    <img id="largeImage">

    <div>
        <button onclick="previousImage()">← Previous</button>
        <button onclick="nextImage()">Next →</button>
        <button onclick="closeViewer()">Close</button>
    </div>
</div>

<script>
    const images = [
        "images/teaser_1.png",
        "images/image2.jpg",
        "images/image3.jpg",
        "images/image4.jpg"
    ];

    let currentImage = 0;

    function openImage(index) {
        currentImage = index;
        document.getElementById("largeImage").src = images[currentImage];
        document.getElementById("viewer").style.display = "flex";
    }

    function closeViewer() {
        document.getElementById("viewer").style.display = "none";
    }

    function previousImage() {
        currentImage--;

        if (currentImage < 0)
            currentImage = images.length - 1;

        document.getElementById("largeImage").src = images[currentImage];
    }

    function nextImage() {
        currentImage++;

        if (currentImage >= images.length)
            currentImage = 0;

        document.getElementById("largeImage").src = images[currentImage];
    }
</script>

</body>
</html>
