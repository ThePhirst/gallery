<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #ff0000;
            border-radius: 0;
            transition: 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: default;
        }

        #viewer img {
            max-width: 90%;
            max-height: 80%;
            cursor: default;
        }

        button {
            margin: 15px 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>FUTURE</h1>

<div class="gallery">
    <img src="images/teaser_1.jpg" onclick="openImage(0)">
    <img src="images/teaser_2.jpg" onclick="openImage(1)">
    <img src="images/teaser_3.jpg" onclick="openImage(2)">
    <img src="images/teaser_4.jpg" onclick="openImage(3)">
</div>

<div id="viewer" onclick="closeViewer()">
    <img id="largeImage">
</div>

<script>
    const images = [
        "images/teaser_1.jpg",
        "images/teaser_2.jpg",
        "images/teaser_3.jpg",
        "images/teaser_4.jpg"
    ];

    function openImage(index) {
        document.getElementById("largeImage").src = images[index];
        document.getElementById("viewer").style.display = "flex";
    }

    function closeViewer() {
        document.getElementById("viewer").style.display = "none";
    }
</script>

</body>
</html>
