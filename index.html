<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        html,
        body,
        * {
            cursor: none !important;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        #accessScreen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #accessScreen.fadeOut {
            opacity: 0;
            pointer-events: none;
        }

        #accessScreen input {
            background: #000;
            color: white;
            border: 2px solid #ff0000;
            padding: 12px;
            width: 260px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        #accessScreen button {
            margin-top: 12px;
            background: #000;
            color: white;
            border: 2px solid #ff0000;
            padding: 10px 24px;
            font-size: 16px;
            cursor: none !important;
        }

        #accessError {
            color: #ff0000;
            margin-top: 12px;
            display: none;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 2px solid #ff0000;
            border-radius: 0;
            transition: 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            z-index: 9998;
        }

        #largeImage {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #customCursor {
            position: fixed;
            display: block;
            width: 48px;
            height: 48px;
            object-fit: contain;
            pointer-events: none;
            z-index: 10001;
            transform: translate(-6px, -6px);
        }
    </style>
</head>

<body>

<div id="accessScreen">
    <div>INSERT_KEYBOARDPROMPT_RESULT</div>
    <input id="accessInput" type="text" autocomplete="off" autofocus>
    <button onclick="checkAccess()">ENTER</button>
    <div id="accessError">ACCESS DENIED</div>
</div>

<h1>FUTURE</h1>

<div class="gallery">
    <img src="images/teaser_1.jpg" onclick="openImage(0)">
    <img src="images/teaser_2.jpg" onclick="openImage(1)">
    <img src="images/teaser_3.jpg" onclick="openImage(2)">
    <img src="images/teaser_4.jpg" onclick="openImage(3)">
</div>

<div id="viewer" onclick="closeViewer()">
    <img id="largeImage">
</div>

<img id="customCursor" src="images/node.gif">

<script>
    const images = [
        "images/teaser_1.jpg",
        "images/teaser_2.jpg",
        "images/teaser_3.jpg",
        "images/teaser_4.jpg"
    ];

    const viewer = document.getElementById("viewer");
    const largeImage = document.getElementById("largeImage");
    const customCursor = document.getElementById("customCursor");
    const accessScreen = document.getElementById("accessScreen");
    const accessInput = document.getElementById("accessInput");
    const accessError = document.getElementById("accessError");
    const incorrectSound = new Audio("sounds/friend_join.wav");
    const correctSound = new Audio("sounds/warningbell1.wav");

    function checkAccess() {
        if (accessInput.value.toLowerCase() === "infra") {
            correctSound.currentTime = 0;
            correctSound.play();
            accessScreen.classList.add("fadeOut");

            setTimeout(function() {
                accessScreen.style.display = "none";
            }, 1000);
        } else {
            incorrectSound.currentTime = 0;
            incorrectSound.play();
            accessError.style.display = "block";
            accessInput.value = "";
            accessInput.focus();
        }
    }

    accessInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            checkAccess();
        }
    });

    function openImage(index) {
        largeImage.src = images[index];
        viewer.style.display = "flex";
    }

    function closeViewer() {
        viewer.style.display = "none";
    }

    document.addEventListener("mousemove", function(event) {
        customCursor.style.left = event.clientX + "px";
        customCursor.style.top = event.clientY + "px";
    });
</script>

</body>
</html>
