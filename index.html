<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
            cursor: none;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: none;
            border: 2px solid #ff0000;
            border-radius: 0;
            transition: 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        #customCursor {
            position: fixed;
            display: block;
            width: 48px;
            height: 48px;
            object-fit: contain;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-6px, -6px);
        }

        button {
            margin: 15px 5px;
            padding: 10px 20px;
            cursor: none;
        }
    </style>
</head>

<body>

<h1>FUTURE</h1>

<div class="gallery">
    <img src="images/teaser_1.jpg" onclick="openImage(0)">
    <img src="images/teaser_2.jpg" onclick="openImage(1)">
    <img src="images/teaser_3.jpg" onclick="openImage(2)">
    <img src="images/teaser_4.jpg" onclick="openImage(3)">
</div>

<div id="viewer" onclick="closeViewer()">
    <img id="largeImage">
</div>

<img id="customCursor" src="images/node.gif">

<script>
    const images = [
        "images/teaser_1.jpg",
        "images/teaser_2.jpg",
        "images/teaser_3.jpg",
        "images/teaser_4.jpg"
    ];

    const viewer = document.getElementById("viewer");
    const largeImage = document.getElementById("largeImage");
    const customCursor = document.getElementById("customCursor");

    function openImage(index) {
        largeImage.src = images[index];
        viewer.style.display = "flex";
    }

    function closeViewer() {
        viewer.style.display = "none";
    }

    document.addEventListener("mousemove", function(event) {
        customCursor.style.left = event.clientX + "px";
        customCursor.style.top = event.clientY + "px";
    });
</script>

</body>
</html>
