<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 140%;
            height: 140%;
            left: -20%;
            top: -20%;
            pointer-events: none;
            z-index: -1;

            background:
                linear-gradient(
                    45deg,
                    rgba(120, 40, 180, 0.14) 25%,
                    transparent 25%,
                    transparent 75%,
                    rgba(120, 40, 180, 0.14) 75%
                ),
                linear-gradient(
                    45deg,
                    rgba(120, 40, 180, 0.14) 25%,
                    transparent 25%,
                    transparent 75%,
                    rgba(120, 40, 180, 0.14) 75%
                );

            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;

            transform: translate(
                calc(var(--parallax-x, 0px)),
                calc(var(--parallax-y, 0px))
            );

            transition: transform 0.15s ease-out;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #ff0000;
            border-radius: 0;
            transition: 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
        }

        #viewer img {
            max-width: 90%;
            max-height: 80%;
            cursor: pointer;
        }

        button {
            margin: 15px 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>FUTURE</h1>

<div class="gallery">
    <img src="images/teaser_1.png" onclick="openImage(0)">
    <img src="images/image2.jpg" onclick="openImage(1)">
    <img src="images/image3.jpg" onclick="openImage(2)">
    <img src="images/image4.jpg" onclick="openImage(3)">
</div>

<div id="viewer" onclick="closeViewer()">
    <img id="largeImage">
</div>

<script>
    const images = [
        "images/teaser_1.png",
        "images/image2.jpg",
        "images/image3.jpg",
        "images/image4.jpg"
    ];

    function openImage(index) {
        document.getElementById("largeImage").src = images[index];
        document.getElementById("viewer").style.display = "flex";
    }

    function closeViewer() {
        document.getElementById("viewer").style.display = "none";
    }

    document.addEventListener("mousemove", function(event) {
        const x = (event.clientX / window.innerWidth - 0.5) * 24;
        const y = (event.clientY / window.innerHeight - 0.5) * 24;

        document.documentElement.style.setProperty("--parallax-x", x + "px");
        document.documentElement.style.setProperty("--parallax-y", y + "px");
    });
</script>

</body>
</html>
